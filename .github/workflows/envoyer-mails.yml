name: Envoi des mails de notification

# Toutes les 5 minutes : demande à l'application les notifications en attente,
# les envoie par SMTP depuis GitHub (Render gratuit bloque le SMTP sortant),
# puis rend le résultat à l'application. Voir .github/scripts/envoyer_mails.py.
#
# Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) :
#   APP_URL, CRON_TOKEN                    adresse de l'application (sans slash final) et jeton partagé avec Render
#   MAIL_HOST, MAIL_PORT, MAIL_SECURE      serveur SMTP, port, tls | ssl | none
#   MAIL_USER, MAIL_PASS, MAIL_FROM        identifiants de la boîte et adresse expéditrice
#   MAIL_FROM_NAME (facultatif)            nom affiché
# Variable Render : MAIL_ENABLED=1 (le serveur n'a pas besoin des identifiants SMTP).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Jamais deux envois en même temps : ils enverraient deux fois les mêmes mails.
concurrency:
  group: envoyer-mails
  cancel-in-progress: false

jobs:
  envoyer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Envoyer les mails
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_SECURE: ${{ secrets.MAIL_SECURE }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
        run: python3 .github/scripts/envoyer_mails.py
