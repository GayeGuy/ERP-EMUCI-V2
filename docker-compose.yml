# ============================================================
#  Environnement de développement local — ERP EMUCI / StockApp
#  Variante VPS (MySQL) — branche `vps-mysql`
# ============================================================
#
#  Le déploiement VPS réel n'utilise pas Docker (Apache + PHP-FPM installés
#  directement sur la machine, cf. DEPLOY-VPS-MYSQL.md). Ce fichier sert
#  uniquement à faire tourner l'application localement contre un vrai MySQL,
#  pour vérifier le code au lieu de le relire.
#
#    docker compose up -d --build     démarrer
#    docker compose logs -f app       suivre les erreurs PHP
#    docker compose down              arrêter (la base est conservée)
#    docker compose down -v           arrêter et repartir d'une base vierge
#
#  L'application écoute sur http://localhost:8081 (8080 est déjà pris par
#  le sandbox PostgreSQL de `main`, cf. docker-compose.yml de cette branche
#  vs celui de main — les deux peuvent tourner en parallèle).
#  La base est joignable depuis la machine sur le port 33061.

services:
  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stockapp
      MYSQL_USER: stockapp
      MYSQL_PASSWORD: stockapp
    ports:
      - "33061:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./sql:/sql:ro
      # Ne s'exécute qu'à la création de la base, jamais aux démarrages
      # suivants : comportement standard de l'image mysql officielle.
      - ./docker/initdb.sh:/docker-entrypoint-initdb.d/10-charger.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -proot --silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: stockapp
      DB_USER: root
      DB_PASS: root
      APP_URL: http://localhost:8081
      APP_TIMEZONE: Africa/Abidjan
      PORT: "8080"
    ports:
      - "8081:8080"
    volumes:
      # Le code est monté depuis la machine : un fichier enregistré dans
      # l'éditeur est pris en compte au rechargement de la page, sans
      # reconstruire l'image.
      - .:/var/www/html
      # vendor/ n'existe pas sur la machine (il est committé dans cette
      # branche, cf. DEPLOY-VPS-MYSQL.md) — rien à masquer ici, pas de
      # volume nommé nécessaire contrairement à la variante PostgreSQL.

volumes:
  db-data:
